<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Servicios</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="admin-container">
    <div class="page-header">
      <h1>Gestión de Servicios</h1>
      <p class="subtitle">Cargá/gestioná los servicios base</p>
    </div>

    <div class="admin-grid">
      <div class="admin-card">
        <h3>Agregar servicio</h3>
        <form method="POST">
          <label>Nombre</label>
          <input type="text" name="nombre" placeholder="Ej: Masajes" required>

          <label style="display:flex; gap:10px; align-items:center;">
            <input type="checkbox" name="activo" checked>
            Activo
          </label>

          <button type="submit" class="btn-pro">Guardar</button>
        </form>

        <div style="margin-top:14px;">
          <a href="/admin">← Volver al panel</a>
        </div>
      </div>

      <div class="admin-card">
        <h3>Servicios cargados</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nombre</th><th>Activo</th></tr>
            </thead>
            <tbody>
              {% for s in servicios %}
                <tr>
                  <td>{{ s.nombre }}</td>
                  <td>{{ "Sí" if s.activo else "No" }}</td>
                </tr>
              {% else %}
                <tr><td colspan="2">No hay servicios</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
