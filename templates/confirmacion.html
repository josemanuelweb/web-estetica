<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación - PRO Estética</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-image: url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); background-size: cover; text-align: center; color: white; font-family: 'Poppins', sans-serif;">
    
    <div style="background: rgba(0,0,0,0.5); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="font-size: 3rem;">¡Gracias, {{ nombre }}!</h1>
        <p style="font-size: 1.2rem;">Tu turno ha sido registrado. Presioná abajo para finalizar.</p>
        
        <a href="{{ link }}" id="btn-finalizar" target="_blank" 
           style="background-color: #25d366; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 1.1rem;">
            ✅ AVISAR POR WHATSAPP
        </a>
    </div>

    <script>
        // Al darle clic al botón, esperamos un segundo y mandamos la web al inicio
        document.getElementById('btn-finalizar').addEventListener('click', function() {
            setTimeout(function() {
                window.location.href = "/";
            }, 1000); // 1 segundo de espera
        });
    </script>
</body>
</html>
