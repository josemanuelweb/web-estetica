<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar Turno</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260301c') }}">
  {% include '_analytics.html' %}
</head>
<body>

  <div class="formulario-card">
    <h1>Reservar en {{ sucursal }}</h1>
    <p class="subtitle" style="margin-top:6px;">Elegí servicio, fecha y horario disponible</p>

    <form action="/confirmar" method="POST" id="formReserva">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label>Nombre y Apellido</label>
      <input type="text" name="nombre" placeholder="Ej: Nombre y Apellido" required>

      <label>Teléfono / WhatsApp</label>
      <input type="tel" name="telefono" placeholder="Ej: +54 9 11 0000-0000" required>

      <label>Servicio</label>
      <select name="opcion_id" id="opcion_id" required>
        {% for o in opciones %}
          <option value="{{ o.id }}">{{ o.servicio.nombre }} - {{ o.duracion }} min - ${{ o.precio }}</option>
        {% endfor %}
      </select>

      <input type="hidden" name="sucursal" value="{{ sucursal }}">
      <input type="hidden" name="direccion" value="{{ direccion }}">
      <input type="hidden" name="fecha_cita" id="fecha_cita" required>

      <label>Fecha del turno</label>
      <input type="date" id="fecha" required>

      <label>Hora disponible</label>
      <select id="hora" required disabled>
        <option value="">Seleccioná una fecha...</option>
      </select>

      <div class="notice" id="estado" style="display:none; color: #8e735b; margin: 10px 0; font-size: 0.9rem;"></div>

      <button type="submit" class="btn-pro" id="btnSubmit" disabled>Continuar a la Seña</button>
    </form>

    <div style="margin-top:14px;">
      <a href="/">← Volver a sucursales</a>
    </div>
  </div>

<script>
  const fechaEl = document.getElementById('fecha');
  const horaEl = document.getElementById('hora');
  const opcionEl = document.getElementById('opcion_id');
  const fechaCitaEl = document.getElementById('fecha_cita');
  const estadoEl = document.getElementById('estado');
  const btnSubmit = document.getElementById('btnSubmit');

  const ahora = new Date();
  const yyyy = ahora.getFullYear();
  const mm = String(ahora.getMonth() + 1).padStart(2, '0');
  const dd = String(ahora.getDate()).padStart(2, '0');
  const hoyStr = `${yyyy}-${mm}-${dd}`;

  fechaEl.min = hoyStr;
  fechaEl.value = hoyStr;

  async function cargarSlots() {
    const date = fechaEl.value;
    const opcion_id = opcionEl.value;
    const sucursal = "{{ sucursal }}";

    if (!date || !opcion_id) return;

    horaEl.innerHTML = '<option value="">Cargando horarios...</option>';
    horaEl.disabled = true;
    btnSubmit.disabled = true;

    try {
      const url = `/api/slots?date=${date}&sucursal=${encodeURIComponent(sucursal)}&opcion_id=${opcion_id}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.ok && data.slots.length > 0) {
        horaEl.innerHTML = '<option value="">Elegí un horario</option>' +
          data.slots.map(h => `<option value="${h}">${h}</option>`).join('');
        horaEl.disabled = false;
        estadoEl.style.display = 'none';
      } else {
        horaEl.innerHTML = '<option value="">Sin horarios</option>';
        estadoEl.textContent = "No hay turnos disponibles para esa fecha. Probá otra.";
        estadoEl.style.display = 'block';
      }
    } catch (e) {
      estadoEl.textContent = "No pudimos cargar horarios. Reintentá.";
      estadoEl.style.display = 'block';
    }
  }

  function actualizarFechaFinal() {
    if (fechaEl.value && horaEl.value) {
      fechaCitaEl.value = `${fechaEl.value}T${horaEl.value}`;
      btnSubmit.disabled = false;
    } else {
      btnSubmit.disabled = true;
    }
  }

  fechaEl.addEventListener('change', () => {
    fechaCitaEl.value = '';
    cargarSlots();
  });
  opcionEl.addEventListener('change', () => {
    fechaCitaEl.value = '';
    cargarSlots();
  });
  horaEl.addEventListener('change', actualizarFechaFinal);

  cargarSlots();
</script>

{% include '_floating_wa.html' %}
</body>
</html>
